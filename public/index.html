<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amak Asantewaaba Ventures | Submersible Pumps</title>

  <meta name="description" content="Amak Asantewaaba Ventures supplies submersible pumps and other business products in Ghana.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #123b5d;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 17px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      color: #123b5d;
      margin-bottom: 10px;
    }

    .products-title {
      text-align: center;
      margin-bottom: 20px;
      color: #123b5d;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .product-info {
      padding: 18px;
      text-align: center;
    }

    .product-info h3 {
      color: #123b5d;
      margin-bottom: 10px;
    }

    .product-info p {
      margin-bottom: 15px;
    }

    .contact-btn {
      display: inline-block;
      background: #168a45;
      color: white;
      padding: 11px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-btn:hover {
      background: #106b35;
    }

    .contact {
      background: white;
      margin-top: 35px;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .contact h2 {
      color: #123b5d;
      margin-bottom: 15px;
    }

    .contact p {
      margin: 9px 0;
    }

    .contact a {
      color: #123b5d;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      margin-top: 30px;
      background: #123b5d;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
